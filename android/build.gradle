plugins {
    id 'com.android.library'
}

group 'com.sample.edgedetection'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

android {
    compileSdkVersion 36
    namespace 'com.sample.edgedetection'
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        viewBinding = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    // OpenCV 4.12.0 minimal build: yalnizca kullanilan moduller (core, imgproc, imgcodecs)
    // Kaynaktan 16KB page-size uyumlu olarak derlendi. JNI lib'ler src/main/jniLibs altinda.
    // Bu, tam OpenCV AAR'a gore ~%50 daha kucuk libopencv_java4.so saglar.
    implementation files('libs/opencv-classes.jar')
}
