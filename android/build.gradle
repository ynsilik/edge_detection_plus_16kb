plugins {
    id 'com.android.library'
}

group 'com.sample.edgedetection'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

android {
    compileSdkVersion 36
    namespace 'com.sample.edgedetection'
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        viewBinding = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // CameraX: onizleme + analiz + yuksek cozunurluklu cekim ayni 4:3 gorus alanindan.
    // Surum, uygulamadaki mobile_scanner ile ayni tutuldu (APK'ya ek yuk getirmez,
    // CameraX 1.4+ native kutuphaneleri 16KB sayfa uyumludur).
    def camerax_version = '1.6.1'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // OpenCV 4.12.0 minimal build: yalnizca kullanilan moduller (core, imgproc, imgcodecs)
    // Kaynaktan 16KB page-size uyumlu olarak derlendi. JNI lib'ler src/main/jniLibs altinda.
    // Bu, tam OpenCV AAR'a gore ~%50 daha kucuk libopencv_java4.so saglar.
    implementation files('libs/opencv-classes.jar')
}
